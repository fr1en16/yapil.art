name: Keep Supabase Alive

on:
  schedule:
    # Запуск каждые 8 часов (в 04:00, 12:00, 20:00 UTC)
    - cron: '0 4,12,20 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          curl -s -f -X POST "${{ secrets.PUBLIC_SUPABASE_URL }}/rest/v1/rpc/keep_alive_ping" \
            -H "apikey: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"
