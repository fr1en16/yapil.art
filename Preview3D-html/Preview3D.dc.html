<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { rotX: 22, rotY: -24, dragging: false };
    this._drag = null;
    this.onDown = this.onDown.bind(this);
    this.onMove = this.onMove.bind(this);
    this.onUp = this.onUp.bind(this);
    this.onReset = this.onReset.bind(this);
  }
  componentDidMount() {
    window.addEventListener('pointermove', this.onMove);
    window.addEventListener('pointerup', this.onUp);
  }
  componentWillUnmount() {
    window.removeEventListener('pointermove', this.onMove);
    window.removeEventListener('pointerup', this.onUp);
  }
  onDown(e) {
    this._drag = { x: e.clientX, y: e.clientY, rotX: this.state.rotX, rotY: this.state.rotY };
    this.setState({ dragging: true });
  }
  onMove(e) {
    if (!this.state.dragging || !this._drag) return;
    var dx = e.clientX - this._drag.x;
    var dy = e.clientY - this._drag.y;
    var rotY = this._drag.rotY + dx * 0.35;
    var rotX = this._drag.rotX - dy * 0.35;
    this.setState({ rotX: rotX, rotY: rotY });
  }
  onUp() {
    if (this.state.dragging) this.setState({ dragging: false });
    this._drag = null;
  }
  onReset() {
    this.setState({ rotX: 22, rotY: -24 });
  }
  renderVals() {
    return {
      rotX: this.state.rotX,
      rotY: this.state.rotY,
      cursor: this.state.dragging ? 'grabbing' : 'grab',
      onDown: this.onDown,
      onReset: this.onReset
    };
  }
}
</script>
